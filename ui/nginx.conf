server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA. Any unknown path falls back to index.html so a deep link or a
    # refresh does not 404 — but this is declared *after* the API locations
    # below so it cannot swallow them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- engine API ---------------------------------------------------------
    # Proxied rather than called cross-origin, so the browser sees one origin
    # and the C++ server needs no CORS handling.

    location /order   { proxy_pass http://server:8080; }
    location /book    { proxy_pass http://server:8080; }
    location /healthz { proxy_pass http://server:8080; }

    # /stats and /stats/engine both live here.
    location /stats {
        proxy_pass http://server:8080;
    }

    location /snapshot {
        proxy_pass http://server:8080;
    }

    # --- SSE ----------------------------------------------------------------
    # Every one of these is required. Without them nginx buffers the response
    # and the browser receives nothing until the buffer fills, which for a
    # market data stream is indistinguishable from the server being broken.
    location /stream {
        proxy_pass http://server:8080;

        # HTTP/1.1 and no Connection: close, or the upgrade-less long-lived
        # response is terminated.
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # The three that actually matter for SSE.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # A stream is idle whenever the market is. The default 60s read timeout
        # would close it between heartbeats on a quiet book.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed asset filenames, so they can be cached hard. index.html must not
    # be, or a deploy leaves clients on the old bundle indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
